[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-mcp"
dynamic = ["version"]
description = "Local, Markdown-first shared memory for AI coding agents, served over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "memory", "llm", "agents", "markdown", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
]
# mcp 2.x introduced an incompatible stateless protocol that some clients
# (e.g. Copilot CLI) reject with JSON-RPC -32022, so stay on 1.x.
dependencies = ["mcp>=1.29.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-memory = "ai_memory.cli:main"
ai-memory-mcp = "ai_memory.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_memory = ["web/*.html"]

[tool.setuptools.dynamic]
version = { attr = "ai_memory.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
